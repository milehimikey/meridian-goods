# Gradle build only. The advisory `em validate` job that used to live here has been superseded
# by the em-ci.yml workflow (`em ci init`, MIL-166), which gates PRs on em validate, slice index
# freshness, coverage, ledger, skill drift, and glossary consistency — see em-ci.yml and
# em-conform.yml for the em-side checks.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Gradle build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: ./gradlew build
        run: ./gradlew build --no-daemon
