name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Gradle build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: ./gradlew build
        run: ./gradlew build --no-daemon

  em-validate:
    name: em validate (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: em validate meridian-goods.em
        run: npx --yes @milehimikey/em@1.8.0 validate meridian-goods.em
