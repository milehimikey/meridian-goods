# Generated once by `em ci init meridian-goods.em` (em 1.8.1) — docs/ci.md
#
# This file is yours from here: edit it, add jobs, remove ones you don't want. The content
# between the GENERATED:em-ci markers below is what a future `em ci init`
# (e.g. after upgrading em) refreshes in place — add your own jobs above or below the markers,
# at the same indent under `jobs:`, and they survive a re-run untouched. Every gate here fails
# the PR the same way any other required check does; the status-badge job only ever publishes.
# `em ci init meridian-goods.em --check` reports drift in the managed block — advisory unless you wire
# it into a gate yourself (docs/ci.md).
#
# PINNED (em 1.9.0 validation, meridian-goods PR): every `npx @milehimikey/em` call below is
# pinned to `@^1.9.0`, which is not yet published to npm at the time this workflow was generated
# (generated against a local em 1.9.0-pre build). These gates will fail — package not found —
# until em 1.9.0 actually ships; that's expected, not a bug in this preset. Once it ships, either
# leave the pin (it'll resolve normally) or re-run `em ci init` to return to the unpinned default.
name: em ci

on:
  pull_request:
    paths:
      - "**/*.em"
      - "**/slices/**"
      - "**/README.md"
  push:
    branches: [main]

jobs:
# GENERATED:em-ci:start
  validate:
    name: em validate (changed .em files)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate changed models
        run: |
          set -e
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head" -- '*.em')
          if [ -z "$changed" ]; then
            echo "no .em files changed"
            exit 0
          fi
          status=0
          for f in $changed; do
            echo "::group::em validate $f"
            npx @milehimikey/em@^1.9.0 validate "$f" || status=1
            npx @milehimikey/em@^1.9.0 validate "$f" --list-issues
            echo "::endgroup::"
          done
          exit $status

  slice-index:
    name: "em slice index --check (README table drift)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check README Slices table is current
        run: npx @milehimikey/em@^1.9.0 slice index "meridian-goods.em" --check

  coverage:
    name: "em coverage --strict (invariant citations)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check invariant test coverage
        run: npx @milehimikey/em@^1.9.0 coverage "meridian-goods.em" --tests "src/test" --strict

  ledger:
    name: em ledger (slice doc version/content agreement)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check slice doc version/content agreement
        run: npx @milehimikey/em@^1.9.0 ledger "meridian-goods.em" --from "${{ github.event.pull_request.base.sha }}"

  skill-check:
    name: em skill check (vendored skill drift)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check vendored skill matches installed em
        run: |
          if [ -d .claude/skills/event-modeling ]; then
            npx @milehimikey/em@^1.9.0 skill check
          else
            echo "no vendored skill at .claude/skills/event-modeling — skipping (run `em skill install` to opt in)"
          fi

  glossary:
    name: "em glossary --fail-on-conflicts (cross-model vocabulary)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check glossary consistency across models
        run: npx @milehimikey/em@^1.9.0 glossary $(git ls-files '*.em') --fail-on-conflicts

  status-badge:
    name: rebuild status badge (advisory — publish only, never a gate)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild status badge
        run: npx @milehimikey/em@^1.9.0 status "meridian-goods.em" --tests "src/test" --badge -o status-badge.svg
      - name: Commit badge if changed
        run: |
          if git diff --quiet -- status-badge.svg; then
            echo "status-badge.svg unchanged"
            exit 0
          fi
          git config user.name "em-ci"
          git config user.email "em-ci@users.noreply.github.com"
          git add status-badge.svg
          git commit -m "em ci: rebuild status badge [skip ci]"
          git push
# GENERATED:em-ci:end
